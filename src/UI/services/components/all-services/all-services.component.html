<div class="container">
    <div class="header">
        <h1>Todos los servicios</h1>
        <button id="newServiceBtn" class="btn btn-new" (click)="handleCreate()">
            <i class="fas fa-plus"></i> Ingresar Servicio
        </button>
    </div>
    <table>
        <thead>
            <tr>
                <th><i class="fas fa-hashtag"></i> ID</th>
                <th><i class="fas fa-laptop"></i> CPU</th>
                <th><i class="fas fa-microchip"></i> Procesador</th>
                <th><i class="fas fa-memory"></i> RAM</th>
                <th><i class="fas fa-hdd"></i> Disco</th>
                <th><i class="fas fa-cogs"></i> Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let service of services">
                <td data-label="ID">{{service.id}}</td>
                <td data-label="CPU">{{service.hardware.cpu}}</td>
                <td data-label="Procesador">{{service.hardware.processor}}</td>
                <td data-label="RAM">{{service.ram.capacity}} - {{service.ram.type}}</td>
                <td data-label="Disco">{{service.hardDrive.capacity}} - {{service.hardDrive.type}}</td>
                <td data-label="Acción">
                    <button class="btn btn-delete" (click)="handleDelete(service)"><i class="fas fa-trash"></i></button>
                    <button class="btn btn-view" (click)="handleView(service)"><i class="fas fa-eye"></i></button>
                    <button class="btn btn-edit" (click)="handleEdit(service)"><i class="fas fa-edit"></i></button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
