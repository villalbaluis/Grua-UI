<section class="bg-secondary py-3 py-md-5 py-xl-8">
    <div class="container">
        <div class="row gy-4 align-items-center">
            <div class="col-12 col-md-6 col-xl-7">
                <div class="d-flex justify-content-center text-bg-secondary">
                    <div class="col-12 col-xl-9">
                        <img class="img-fluid rounded mb-4 " loading="lazy" src="../../../assets/branding/logo-sena.png"
                            width="245" height="80" alt="">
                        <hr class="border-secondary-subtle mb-4">
                        <h2 class="h1 mb-4">Sistema de gestión de mantenimientos</h2>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-xl-5">
                <div class="card border-0 rounded-4">
                    <div class="card-body p-3 p-md-4 p-xl-5">
                        <div class="row">
                            <div class="col-12">
                                <div class="mb-4">
                                    <h3>Inicia Sesión</h3>
                                </div>
                            </div>
                        </div>
                        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                            <div class="row gy-3 overflow-hidden">
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" formControlName="username" id="username"
                                            placeholder="JohnDoe123" required>
                                        <label for="username" class="form-label">Nombre de usuario</label>
                                    </div>
                                    <div *ngIf="isFieldInvalid('username')" class="text-danger">
                                        {{ getErrorMessage('username') }}
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="password" class="form-control" formControlName="password"
                                            id="password" placeholder="Password" required>
                                        <label for="password" class="form-label">Contraseña</label>
                                    </div>
                                    <div *ngIf="isFieldInvalid('password')" class="text-danger">
                                        {{ getErrorMessage('password') }}
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="d-grid mt-3">
                                        <button class="btn btn-secondary btn-lg" type="submit">Iniciar Sesión</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                        <div class="row">
                            <div class="col-12">
                                <div class="d-flex gap-2 gap-md-4 flex-column flex-md-row justify-content-md-end mt-1">
                                    <a href="#!">¿Olvidaste tu contraseña?</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
